[package]
name = "dark-server"
description = "DARK multiplayer backend: matchmaking, authoritative battle-royale matches over WebSocket, metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dark-server"
path = "src/main.rs"

[dependencies]
dark-protocol.workspace = true
dark-sim.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
clap = { version = "4.6", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
toml = "1"

[dev-dependencies]
tokio-tungstenite = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[lints]
workspace = true
