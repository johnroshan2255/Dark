[workspace]
resolver = "3"
members = ["crates/protocol", "crates/sim", "crates/server", "crates/bots", "crates/vehicle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
dark-protocol = { path = "crates/protocol" }
dark-sim = { path = "crates/sim" }
dark-vehicle = { path = "crates/vehicle" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `cargo run -p dark-server -- --dev` simulates every room's cars and bots (Rapier): unoptimised, a room's physics
# step took ~20 ms of the 33 ms tick and ticks overran — bots and remote players stalled and jumped. Dependencies
# fully optimised, our crates lightly (still debuggable, overflow checks on).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind" # a panicking match task is caught and only that match ends
